name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Review npm dependency changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detect npm dependency changes
        id: npm_changes
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              core.setOutput('changed', 'false');
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100
              }
            );
            const changed = files.some(({ filename }) => /^package(-lock)?\.json$/.test(filename));
            core.setOutput('changed', changed ? 'true' : 'false');

      - name: Audit npm dependencies
        if: steps.npm_changes.outputs.changed == 'true'
        run: npm audit --package-lock-only --audit-level=high

      - name: No npm dependency changes
        if: steps.npm_changes.outputs.changed != 'true'
        run: echo "No npm dependency manifest changes detected."

name: Terraform Security

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/terraform-security.yml"
  push:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - ".github/workflows/terraform-security.yml"

permissions:
  contents: read

jobs:
  terraform-security:
    name: Terraform fmt, validate, and Checkov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: pip install checkov

      - name: Terraform format check
        run: terraform fmt -check -recursive infrastructure

      - name: Terraform init and validate
        run: terraform -chdir=infrastructure/environments/lab init -backend=false && terraform -chdir=infrastructure/environments/lab validate

      - name: Terraform security scan
        run: checkov -d infrastructure/environments/lab --framework terraform --quiet --soft-fail-on LOW,MEDIUM

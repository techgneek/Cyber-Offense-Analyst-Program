name: Deploy Security Lab

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write
  packages: write

concurrency:
  group: deploy-security-lab
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    name: Build and Deploy Lab
    runs-on: ubuntu-latest
    environment: security-testing-lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build app
        run: npm run build

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: pip install checkov

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push lab image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:lab-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:lab-latest

      - name: Terraform format check
        run: terraform fmt -check -recursive infrastructure

      - name: Terraform init and validate
        run: terraform -chdir=infrastructure/environments/lab init -backend=false && terraform -chdir=infrastructure/environments/lab validate

      - name: Terraform security scan
        run: checkov -d infrastructure/environments/lab --framework terraform --quiet --soft-fail-on LOW,MEDIUM

      - name: Deploy lab with Terraform script
        env:
          TF_VAR_container_image: ${{ env.IMAGE_NAME }}:lab-${{ github.sha }}
          TF_VAR_environment_variables: '{"LAB_TRAINING_MODE" = "true"}'
          LAB_ASSUME_YES: "true"
          CI: "true"
        run: ./scripts/deploy.sh

      - name: Capture outputs
        if: always()
        run: terraform -chdir=infrastructure/environments/lab output

      - name: Upload Terraform lockfile artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-terraform-artifacts
          path: |
            infrastructure/environments/lab/.terraform.lock.hcl
          if-no-files-found: ignore

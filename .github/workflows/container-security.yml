name: Container Security

on:
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "server.ts"
      - "src/**"
      - "api/**"
      - ".github/workflows/container-security.yml"
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "server.ts"
      - "src/**"
      - "api/**"
      - ".github/workflows/container-security.yml"

permissions:
  contents: read
  security-events: write

jobs:
  container-security:
    name: Dockerfile lint and Trivy scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: dockerfile
        run: echo "present=${{ hashFiles('Dockerfile') != '' }}" >> "$GITHUB_OUTPUT"

      - name: Hadolint Dockerfile lint
        if: steps.dockerfile.outputs.present == 'true'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build lab image for scanning
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: aetosai-security-mentor:scan

      - name: Trivy filesystem scan
        if: steps.dockerfile.outputs.present == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
          format: table

      - name: Trivy image scan
        if: steps.dockerfile.outputs.present == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aetosai-security-mentor:scan
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
          format: table

      - name: Skip container scan when Dockerfile is absent
        if: steps.dockerfile.outputs.present != 'true'
        run: echo "No root Dockerfile found; skipping Dockerfile lint and Trivy image scan."

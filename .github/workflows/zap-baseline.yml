name: ZAP Baseline

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Lab URL to scan with the passive ZAP baseline
        required: true
        type: string
      report_name:
        description: Report artifact name prefix
        required: false
        default: zap-baseline
        type: string

permissions:
  contents: read

jobs:
  zap-baseline:
    name: Passive ZAP Baseline Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare ZAP workspace
        run: mkdir -p zap

      - name: Run ZAP Baseline scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "${{ inputs.target_url }}" \
              -r "${{ inputs.report_name }}.html" \
              -J "${{ inputs.report_name }}.json" \
              -w "${{ inputs.report_name }}-warnings.md"

      - name: Summarize scan artifacts
        if: always()
        run: |
          {
            echo '## ZAP Baseline Summary'
            echo ''
            echo "- Target URL: ${{ inputs.target_url }}"
            echo "- HTML report: zap/${{ inputs.report_name }}.html"
            echo "- JSON report: zap/${{ inputs.report_name }}.json"
            echo "- Warning summary: zap/${{ inputs.report_name }}-warnings.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.report_name }}-reports
          path: |
            zap/${{ inputs.report_name }}.html
            zap/${{ inputs.report_name }}.json
            zap/${{ inputs.report_name }}-warnings.md
          if-no-files-found: warn
